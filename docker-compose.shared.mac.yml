# ============================================================================
# SHARED STACK — macOS override: reach Ollama running NATIVELY on the host
# (Metal GPU). Docker Desktop's Linux VM can't use the Apple GPU, so Ollama runs
# on the host and this tiny nginx proxy (aliased "ollama" on the shared network)
# forwards to it, rewriting the Host header to satisfy Ollama's rebind guard.
# litellm/config.yaml's `api_base: http://ollama:11434` then works unchanged.
#
# One-time host setup:  brew install ollama
#   OLLAMA_HOST=0.0.0.0 ollama serve   # must bind 0.0.0.0 for containers to reach it
#   ollama pull qwen2.5:7b             # + qwen2.5:32b for the 32B tier
# ============================================================================
services:
  ollama-proxy:
    image: nginx:alpine
    container_name: jb-ai-shared-ollama-proxy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./litellm/ollama-host-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
        aliases:
          - ollama

  litellm:
    depends_on: !override
      ollama-proxy:
        condition: service_started
      postgres:
        condition: service_healthy
