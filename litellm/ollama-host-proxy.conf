# Reverse proxy: lets the stack's containers reach the NATIVE (host) Ollama on a
# Mac while satisfying Ollama's DNS-rebinding guard, which returns HTTP 403 to
# any request whose Host header isn't localhost/127.0.0.1. The containers call
# http://ollama:11434 (unchanged in litellm/config.yaml); on macOS that name
# resolves to THIS proxy (see docker-compose.shared.mac.yml), which forwards to the
# Mac's host Ollama via host.docker.internal and rewrites Host -> localhost.
# Result: model inference stays on the Metal GPU, no host-side env/config needed.
server {
    listen 11434;

    location / {
        proxy_pass http://host.docker.internal:11434;
        proxy_set_header Host localhost;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Stream tokens as they are produced instead of buffering the whole reply.
        proxy_buffering off;
        # Local generations (especially on CPU fallback) can be slow — be patient.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
