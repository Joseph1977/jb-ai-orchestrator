# Standalone compose for running JUST the orchestrator. Postgres and LiteLLM are
# expected to already exist; layer docker-compose.stack.yml on top to join the
# shared stack instead. Override the project name with COMPOSE_PROJECT_NAME.
name: jb-ai-orchestrator

services:
  orchestrator:
    build: .
    container_name: jb-ai-orchestrator
    ports:
      # Loopback by default: the service has no authentication of its own, so it
      # must not be reachable from the network without a gateway in front. Set
      # BIND_ADDR=0.0.0.0 only once something authenticates callers.
      - "${BIND_ADDR:-127.0.0.1}:${AGENT_PORT:-8000}:8000"
    env_file:
      - ./src/.env/docker/.env
    environment:
      - ENV=docker
      # In-place workflow input: mount host folders under /workspaces (or other roots
      # below) and list every container path callers may bind in WORKSPACE_ALLOWED_ROOTS.
      # ALLOW_INPLACE_WORKSPACE and OUTPUT_BINDINGS_ENABLED are deliberately not set
      # here so src/.env/docker/.env stays the single place that decides them; a
      # value listed here would silently override that file.
      - WORKSPACE_ALLOWED_ROOTS=/workspaces
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # A folder on YOUR machine that the orchestrator is allowed to access, mounted
      # at /workspaces. Set WORKSPACES_HOST_DIR to a full host path, or leave the
      # ./workspaces default (relative to this compose file). Put workflow folders
      # here; the agent reads them and writes outputs (e.g. memory.json) back.
      - ${WORKSPACES_HOST_DIR:-./workspaces}:/workspaces
    restart: unless-stopped
